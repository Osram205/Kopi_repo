<header class="sticky top-0 z-50 w-full bg-black border-b-4 border-primary-500 transition-colors">
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-accent-500 via-orange-500 to-primary-500"></div>
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <!-- Brand -->
        <a href="/dashboard" class="flex items-center gap-3 text-2xl font-black text-white tracking-tighter hover:text-primary-500 transition-colors uppercase">
            <div class="w-10 h-10 bg-primary-500 flex items-center justify-center transform -skew-x-12">
                <img src="{{ url_for('static', filename='logo/android-chrome-192x192.png') }}" alt="Logo KOPI" class="w-6 h-6 object-contain transform skew-x-12">
            </div>
            <span>KOPI Admin</span>
        </a>
        
        <!-- Navigation Links (Desktop) -->
        <nav class="flex items-center gap-4">
            <div class="hidden md:flex items-center space-x-4 mr-6">
                <a href="/dashboard" class="px-3 py-2 text-sm font-bold uppercase transition-colors {% if request.endpoint == 'dashboard' %}text-primary-500{% else %}text-gray-300 hover:text-primary-500{% endif %}">
                    Métricas
                </a>
                <a href="/usuarios" class="px-3 py-2 text-sm font-bold uppercase transition-colors {% if request.endpoint == 'gestion_usuarios' %}text-primary-500{% else %}text-gray-300 hover:text-primary-500{% endif %}">
                    Solicitudes
                </a>
                <a href="/directorio" class="px-3 py-2 text-sm font-bold uppercase transition-colors {% if request.endpoint == 'directorio_usuarios' %}text-primary-500{% else %}text-gray-300 hover:text-primary-500{% endif %}">
                    Directorio
                </a>
            </div>
            
            <!-- Theme Toggle & Logout -->
            <button type="button" @click="theme = theme === 'dark' ? 'light' : 'dark'" class="w-10 h-10 bg-gray-900 border-2 border-gray-800 flex items-center justify-center text-gray-400 hover:text-primary-500 hover:border-primary-500 transition-all transform hover:-translate-y-1">
                <span x-show="theme === 'dark'">☀️</span>
                <span x-show="theme === 'light'" style="display: none;">🌙</span>
            </button>
            <a href="/logout" class="hidden md:block px-5 py-3 text-sm font-black text-white bg-accent-500 hover:bg-red-600 transition-colors uppercase">
                Cerrar Sesión
            </a>
        </nav>
    </div>
</header>
