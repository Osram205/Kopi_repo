<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <title>Kopi Admin - Login</title>
    {% include 'partials/theme.html' %}
</head>
<body class="bg-brand-900 text-gray-100 font-sans antialiased min-h-screen relative overflow-x-hidden selection:bg-primary-500 selection:text-black transition-colors flex items-center justify-center">
    <!-- Background accents -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
        <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-kopi-yellow/10 blur-[120px]"></div>
        <div class="absolute bottom-[0%] right-[0%] w-[40%] h-[40%] rounded-full bg-kopi-dark blur-[100px]"></div>
    </div>

    <div class="w-full max-w-md bg-brand-800 border-4 border-gray-800 shadow-[12px_12px_0px_rgba(251,191,36,1)] z-10 mx-4 p-8">
        <div class="border-b-4 border-gray-800 p-6 bg-gradient-to-r from-accent-500 to-primary-500 text-white flex justify-between items-center relative mb-8">
            <h1 class="text-3xl font-black uppercase tracking-tighter mix-blend-overlay">KOPI Admin</h1>
            <div class="w-12 h-12 bg-brand-800 flex items-center justify-center border-2 border-gray-800 transform rotate-12 shadow-[4px_4px_0_0_#09090b]">
                <img src="{{ url_for('static', filename='logo/android-chrome-192x192.png') }}" alt="Logo KOPI" class="w-8 h-8 object-contain transform -rotate-12">
            </div>
            <!-- Decorative corner -->
            <div class="absolute top-0 right-0 w-8 h-8 bg-brand-900 -mt-4 -mr-4 border-b-4 border-l-4 border-gray-800 transform rotate-45"></div>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="mb-6 space-y-2">
            {% for category, message in messages %}
              <div class="p-4 font-mono text-sm uppercase font-bold border-4 {% if category == 'danger' %}bg-kopi-black text-red-500 border-red-500 shadow-[4px_4px_0_0_#ef4444]{% else %}bg-kopi-black text-kopi-yellow border-kopi-yellow shadow-[4px_4px_0_0_#facc15]{% endif %}">
                  > {{ message }}
              </div>
            {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

            <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
                <div>
                    <label for="correo" class="block text-sm font-black uppercase text-gray-400 mb-2 tracking-widest">Correo Institucional</label>
                    <input type="email" id="correo" name="correo" required 
                           maxlength="100"
                           class="w-full bg-brand-900 border-2 border-gray-800 px-4 py-3 text-white focus:outline-none focus:border-primary-500 focus:ring-0 transition-colors shadow-[4px_4px_0_0_#18181b]"
                           placeholder="admin@upq.edu.mx">
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-black uppercase text-gray-400 mb-2 tracking-widest">Contraseña</label>
                    <input type="password" id="password" name="password" required 
                           minlength="6" maxlength="32"
                           class="w-full bg-brand-900 border-2 border-gray-800 px-4 py-3 text-white focus:outline-none focus:border-primary-500 focus:ring-0 transition-colors shadow-[4px_4px_0_0_#18181b]"
                           placeholder="••••••••">
                </div>

                <button type="submit" class="w-full bg-primary-500 border-2 border-gray-800 py-4 px-6 text-black font-black uppercase text-lg hover:bg-primary-600 transition-colors shadow-[6px_6px_0px_rgba(251,191,36,0.5)] flex items-center justify-center gap-2 group">
                    <span>Acceder al Panel</span>
                    <svg class="w-5 h-5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-xs font-mono text-gray-500 uppercase">Sistema exclusivo para personal autorizado UPQ.</p>
            </div>
    </div>
</body>
</html>
