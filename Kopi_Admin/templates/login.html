<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Kopi Admin - Login</title>
    {% include 'partials/theme.html' %}
</head>
<body class="min-h-screen flex items-center justify-center bg-kopi-black relative overflow-hidden">
    <!-- Background accents -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
        <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-kopi-yellow/10 blur-[120px]"></div>
        <div class="absolute bottom-[0%] right-[0%] w-[40%] h-[40%] rounded-full bg-kopi-dark blur-[100px]"></div>
    </div>

    <div class="z-10 w-full max-w-md p-8 bg-kopi-black border-4 border-white shadow-[12px_12px_0_0_#ffffff] relative">
        <div class="text-center mb-8 border-b-4 border-white pb-6">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-kopi-yellow border-4 border-kopi-black shadow-[4px_4px_0_0_#000000] mb-4 overflow-hidden relative">
                <img src="{{ url_for('static', filename='logo/android-chrome-192x192.png') }}" alt="Logo KOPI UPQ" class="w-full h-full object-cover">
            </div>
            <h2 class="text-3xl font-black font-mono text-white uppercase tracking-tighter">KOPI Admin</h2>
            <p class="text-sm font-mono text-kopi-yellow uppercase mt-2 bg-kopi-black inline-block px-2 border-2 border-kopi-yellow">Acceso Restringido</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="mb-6 space-y-2">
            {% for category, message in messages %}
              <div class="p-4 font-mono text-sm uppercase font-bold border-4 {% if category == 'danger' %}bg-kopi-black text-red-500 border-red-500 shadow-[4px_4px_0_0_#ef4444]{% else %}bg-kopi-black text-kopi-yellow border-kopi-yellow shadow-[4px_4px_0_0_#facc15]{% endif %}">
                  > {{ message }}
              </div>
            {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-black font-mono text-white uppercase mb-2">Usuario</label>
                <input type="email" name="correo" class="w-full px-4 py-3 bg-kopi-black border-4 border-kopi-gray text-white placeholder-kopi-gray focus:outline-none focus:border-kopi-yellow transition-colors font-mono" placeholder="CORREO INSTITUCIONAL" required>
            </div>
            <div>
                <label class="block text-sm font-black font-mono text-white uppercase mb-2">Contraseña</label>
                <input type="password" name="password" class="w-full px-4 py-3 bg-kopi-black border-4 border-kopi-gray text-white placeholder-kopi-gray focus:outline-none focus:border-kopi-yellow transition-colors font-mono" placeholder="********" required>
            </div>
            <button type="submit" class="w-full py-4 px-4 bg-kopi-yellow text-kopi-black font-black font-mono uppercase border-4 border-kopi-yellow hover:bg-kopi-black hover:text-kopi-yellow hover:shadow-[6px_6px_0_0_#facc15] transition-all">
                Iniciar Secuencia >
            </button>
        </form>
    </div>
</body>
</html>
