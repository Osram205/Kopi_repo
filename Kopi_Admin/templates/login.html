<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Kopi Admin - Login</title>
    {% include 'partials/theme.html' %}
</head>
<body class="min-h-screen flex items-center justify-center bg-kopi-black relative overflow-hidden">
    <!-- Background accents -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
        <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-kopi-yellow/10 blur-[120px]"></div>
        <div class="absolute bottom-[0%] right-[0%] w-[40%] h-[40%] rounded-full bg-kopi-dark blur-[100px]"></div>
    </div>

    <div class="z-10 w-full max-w-md p-8 bg-kopi-card/80 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-kopi-black border border-white/10 shadow-lg mb-4 overflow-hidden">
                <img src="{{ url_for('static', filename='logo/android-chrome-192x192.png') }}" alt="Logo KOPI UPQ" class="w-4/5 h-4/5 object-contain">
            </div>
            <h2 class="text-2xl font-bold text-white tracking-tight">KOPI Admin</h2>
            <p class="text-sm text-kopi-gray mt-1">Panel de Administración UPQ</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="mb-6 space-y-2">
            {% for category, message in messages %}
              <div class="p-3 rounded-lg text-sm {% if category == 'danger' %}bg-red-500/10 text-red-400 border border-red-500/20{% else %}bg-kopi-yellow/10 text-kopi-yellow border border-kopi-yellow/20{% endif %}">
                  {{ message }}
              </div>
            {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-kopi-light mb-1.5">Correo Institucional</label>
                <input type="email" name="correo" class="w-full px-4 py-2.5 bg-kopi-black border border-white/10 rounded-xl text-white placeholder-kopi-gray focus:outline-none focus:border-kopi-yellow focus:ring-1 focus:ring-kopi-yellow transition-colors" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-kopi-light mb-1.5">Contraseña</label>
                <input type="password" name="password" class="w-full px-4 py-2.5 bg-kopi-black border border-white/10 rounded-xl text-white placeholder-kopi-gray focus:outline-none focus:border-kopi-yellow focus:ring-1 focus:ring-kopi-yellow transition-colors" required>
            </div>
            <button type="submit" class="w-full py-3 px-4 bg-kopi-yellow hover:bg-kopi-yellow-hover text-kopi-black font-semibold rounded-xl shadow-lg shadow-kopi-yellow/20 transition-all active:scale-[0.98]">
                Iniciar sesión segura
            </button>
        </form>
    </div>
</body>
</html>
