events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    upstream fastapi_backend {
        server kopi_api:8000;
    }

    upstream admin_backend {
        server kopi_admin:5000;
    }

    server {
        listen 80;
        server_name _;
        
        client_max_body_size 50M;

        # 1. Enrutamiento del App Web Principal (Laravel) en la raíz
        root /var/www/html/public;
        index index.php index.html index.htm;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Procesamiento de PHP para Kopi_Web usando FastCGI hacia php-fpm
        location ~ \.php$ {
            fastcgi_pass kopi_web:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # 2. Enrutamiento para la API Backend (Kopi_API)
        location /api/ {
            # Se redirige eliminando el /api para que FastAPI reciba la ruta desde /
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Enrutamiento para el App de Administración (Flask)
        location /admin/ {
            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass http://admin_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
